name: MotionBench Horizontal Windows

on:
  push:
    branches: [main, 'codex/motionbench-horizontal-*', 'codex/motionbench-2.27.*']
    tags: ['v2.25.*-desktop.*', 'v2.26.*-desktop.*', 'v2.27.*-desktop.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizontal-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install locked dependencies and browsers
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chrome msedge
      - name: Install PDF verification readers
        run: python -m pip install pypdf==6.10.2 pymupdf==1.28.2
      - name: Build and verify every calculation suite
        run: |
          python scripts/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-unit-tests.cjs --artifact-dir output/release/2.27.0-local/acceptance/unit-final
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-desktop-unit-tests.cjs --artifact-dir output/release/2.27.0-local/acceptance/desktop-unit
      - name: Verify method simplification, operation UI and computed report workflows
        run: |
          node tests/method-compatibility-browser-tests.cjs --artifact-dir output/release/2.27.0-local/acceptance/methods-chrome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/operation-ui-browser-tests.cjs --artifact-dir output/release/2.27.0-local/acceptance/operation-chrome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/calculation-browser-tests.cjs --pdf --artifact-dir output/release/2.27.0-local/acceptance/calculations-chrome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/method-compatibility-browser-tests.cjs --edge --artifact-dir output/release/2.27.0-local/acceptance/methods-msedge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/operation-ui-browser-tests.cjs --edge --artifact-dir output/release/2.27.0-local/acceptance/operation-msedge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/calculation-browser-tests.cjs --edge --pdf --artifact-dir output/release/2.27.0-local/acceptance/calculations-msedge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify shared classification and frozen report storage
        run: |
          node tests/horizontal-storage-browser-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/horizontal-storage-browser-tests.cjs --edge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/horizontal-scale-browser-tests.cjs
      - name: Verify complete selection and classification flows in Chrome and Edge
        run: |
          node tests/horizontal-refinement-browser-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/horizontal-refinement-browser-tests.cjs --edge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/report-selection-edge-cases-browser-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/report-selection-edge-cases-browser-tests.cjs --edge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/horizontal-classification-ui-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/horizontal-classification-ui-tests.cjs --edge
      - name: Verify approved report appearance in Chrome and Edge
        run: |
          node tests/personal-report-appearance-browser-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/personal-report-appearance-browser-tests.cjs --edge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/horizontal-appearance-browser-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/horizontal-appearance-browser-tests.cjs --edge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/report-appearance-browser-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/report-appearance-browser-tests.cjs --edge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify shared mini chart geometry in Chrome and Edge
        run: |
          node tests/mini-chart-layout-browser-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/mini-chart-layout-browser-tests.cjs --edge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify report presentation and complete multiperson PDFs
        run: |
          node tests/horizontal-presentation-browser-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/horizontal-multiperson-pdf-tests.cjs
      - name: Build and verify Windows delivery
        run: |
          npm run dist:windows -- --config.directories.output=output/release/2.27.0-local/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-desktop-package.cjs output/release/2.27.0-local/desktop/win-unpacked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath 'output/desktop-package/package-check.json' -Destination 'output/release/2.27.0-local/package-check.json'
          $env:MOTIONBENCH_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'output/release/2.27.0-local/desktop/win-unpacked/MotionBench.exe'
          node tests/native-runner-failure-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/horizontal-refinement-native-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MOTIONBENCH_DESKTOP_ARTIFACT_DIR = 'output/desktop-smoke/horizontal-2.26.3'
          node tests/desktop-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_v2270.py
      - name: Preserve synthetic verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MotionBench-Horizontal-Windows-${{ github.run_number }}
          path: |
            output/tests/horizontal-2.26.3/
            output/release/2.27.0-local/acceptance/
            output/release/2.27.0-local/verification.json
            output/release/2.27.0-local/package-check.json
            output/playwright/horizontal-refinement/chrome/
            output/playwright/horizontal-refinement/msedge/
            output/playwright/horizontal-refinement/presentation/
            output/playwright/horizontal-refinement/multiperson/
            output/playwright/horizontal-storage/
            output/playwright/report-selection-edge-cases/
            output/playwright/horizontal-classification-ui/
            output/playwright/horizontal-scale/
            output/playwright/personal-appearance/
            output/playwright/horizontal-appearance/
            output/playwright/report-appearance/
            output/horizontal-refinement/native-2.26.3/
            output/release/2.26.3-local/native-failure-tests/
            output/release/2.26.3-local/mini-layout/
            output/desktop-package/
            output/desktop-smoke/horizontal-2.26.3/
          if-no-files-found: warn
          retention-days: 14
