name: MotionBench Comparison Windows

on:
  push:
    branches: [main, 'codex/motionbench-comparison-*']
    tags: ['v2.24.*-desktop.*']
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run the optional full regression in addition to focused verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: comparison-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install PDF evidence reader
        run: python -m pip install pypdf==6.10.2 pymupdf==1.28.2
      - name: Install locked dependencies and browsers
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chrome msedge
      - name: Build and run the focused release regression
        run: |
          python scripts/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_v22413.py rebuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_v22413.py units
      - name: Run full calculation regression only when explicitly selected
        if: github.event_name == 'workflow_dispatch' && inputs.full_regression
        run: |
          node tests/run-unit-tests.cjs --artifact-dir output/implementation-2.24.13/resumed/ci/full-units
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-desktop-unit-tests.cjs --artifact-dir output/implementation-2.24.13/resumed/ci/desktop-unit
      - name: Check medicine-ball table and focused PDF
        run: node tests/medicine-ball-table-browser-tests.cjs
      - name: Run full browser regression only when explicitly selected
        if: github.event_name == 'workflow_dispatch' && inputs.full_regression
        run: |
          node tests/personal-report-v22411-browser-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/longitudinal-controls-browser-tests.cjs --skip-pdf --artifact-dir output/implementation-2.24.13/interaction
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/longitudinal-browser-tests.cjs --artifact-dir output/implementation-2.24.13/resumed/ci/browser-full
      - name: Build and verify the standalone Windows programs
        run: |
          npm run dist:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-desktop-package.cjs
      - name: Exercise focused packaged medicine-ball workflow
        run: |
          $env:MOTIONBENCH_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/win-unpacked/MotionBench.exe'
          node tests/medicine-ball-table-browser-tests.cjs --desktop --artifact-dir output/implementation-2.24.13/native
      - name: Run full native regression only when explicitly selected
        if: github.event_name == 'workflow_dispatch' && inputs.full_regression
        run: |
          $env:MOTIONBENCH_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/win-unpacked/MotionBench.exe'
          node tests/longitudinal-browser-tests.cjs --desktop --pdf --artifact-dir output/implementation-2.24.13/resumed/ci/native-full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MOTIONBENCH_DESKTOP_ARTIFACT_DIR = 'output/implementation-2.24.13/resumed/ci/native-smoke'
          node tests/desktop-smoke.cjs
      - name: Verify source-bound focused evidence
        run: python scripts/release_v22413.py verify
      - name: Save synthetic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MotionBench-Comparison-Windows-${{ github.run_number }}
          path: |
            output/implementation-2.24.13/resumed/units/
            output/implementation-2.24.13/focused/
            output/implementation-2.24.13/interaction/
            output/implementation-2.24.13/native/
            output/implementation-2.24.13/resumed/ci/
            output/desktop-package/
          retention-days: 14
