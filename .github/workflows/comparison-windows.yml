name: MotionBench Comparison Windows

on:
  push:
    branches: [main, 'codex/motionbench-comparison-*']
    tags: ['v2.24.*-desktop.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comparison-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install PDF evidence reader
        run: python -m pip install pypdf==6.10.2
      - name: Install locked dependencies and browsers
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chrome msedge
      - name: Build and check all calculation and desktop modules
        run: |
          python scripts/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-unit-tests.cjs --artifact-dir output/tests/v2.24.6-delivery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-desktop-unit-tests.cjs --artifact-dir output/tests/v2.24.6-delivery/desktop-unit
      - name: Check shared trends, PDF and browser workflows
        run: |
          node tests/comparison-trend-browser-tests.cjs --artifact-dir=output/comparison-trend/release-v2246-pdf-isolated/chrome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/run_v2246_browser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify the standalone Windows programs
        run: |
          npm run dist:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-desktop-package.cjs
      - name: Exercise comparison export and reopen in packaged Electron
        run: |
          $env:MOTIONBENCH_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/win-unpacked/MotionBench.exe'
          node tests/longitudinal-browser-tests.cjs --desktop --pdf --artifact-dir output/comparison-trend/release-v2246-pdf-isolated/native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MOTIONBENCH_DESKTOP_ARTIFACT_DIR = 'output/implementation-2.24.6/resumed/native-smoke-isolated'
          node tests/desktop-smoke.cjs
      - name: Verify the source-bound synthetic evidence
        run: python scripts/verify_v2246.py --ci
      - name: Save synthetic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MotionBench-Comparison-Windows-${{ github.run_number }}
          path: |
            output/tests/v2.24.6-delivery/
            output/comparison-trend/release-v2246-pdf-isolated/
            output/implementation-2.24.6/resumed/native-smoke-isolated/
            output/desktop-package/
          retention-days: 14
