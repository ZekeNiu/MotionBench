name: MotionBench Comparison Windows

on:
  push:
    branches: [main, 'codex/motionbench-comparison-complete-*']
    tags: ['v2.24.*-desktop.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comparison-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install locked dependencies and browsers
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chrome msedge
      - name: Build and check all calculation and desktop modules
        run: |
          python scripts/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-unit-tests.cjs --artifact-dir output/tests/v2243
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-desktop-unit-tests.cjs --artifact-dir output/tests/v2243/desktop-unit
      - name: Check personal reports and all comparison flows in both browsers
        shell: pwsh
        run: |
          foreach ($channel in @('chrome','msedge')) {
            $browserArgument = if ($channel -eq 'msedge') { @('--edge') } else { @() }
            node tests/longitudinal-layout-browser-tests.cjs @browserArgument
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node tests/longitudinal-browser-tests.cjs @browserArgument --artifact-dir "output/playwright/v2243/app/$channel"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node tests/report-v220-browser-tests.cjs @browserArgument --artifact-dir "output/playwright/v2243/personal/$channel"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node tests/longitudinal-ai-browser-tests.cjs @browserArgument --artifact-dir "output/playwright/v2243/ai/$channel"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node tests/longitudinal-interaction-browser-tests.cjs @browserArgument --artifact-dir "output/playwright/v2243/interaction/$channel"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and verify the standalone Windows programs
        run: |
          npm run dist:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-desktop-package.cjs
      - name: Exercise comparison export and reopen in packaged Electron
        run: |
          $env:MOTIONBENCH_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/win-unpacked/MotionBench.exe'
          node tests/longitudinal-browser-tests.cjs --desktop --pdf --artifact-dir output/playwright/v2243/app/desktop
      - name: Verify the source-bound synthetic evidence
        run: python scripts/verify_v2243.py --ci
      - name: Save synthetic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MotionBench-Comparison-Windows-${{ github.run_number }}
          path: |
            output/tests/v2243/
            output/playwright/v2243/
            output/desktop-package-check.json
          retention-days: 14
