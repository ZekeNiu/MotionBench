name: MotionBench Comparison Windows

on:
  push:
    branches: [main, 'codex/motionbench-comparison-*']
    tags: ['v2.24.*-desktop.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comparison-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install PDF evidence reader
        run: python -m pip install pypdf==6.10.2
      - name: Install locked dependencies and browsers
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chrome msedge
      - name: Verify acceptance guard cleanup on success and failure
        run: node tests/display-guard-lifecycle-tests.cjs
      - name: Build and run full calculation regression in background CI
        run: |
          python scripts/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_v22410.py rebuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-unit-tests.cjs --artifact-dir output/implementation-2.24.10/resumed/ci/full-units
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-desktop-unit-tests.cjs --artifact-dir output/implementation-2.24.10/resumed/ci/desktop-unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release_v22410.py units
      - name: Check report controls and existing comparison persistence
        run: |
          node tests/report-controls-v22410-browser-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/longitudinal-controls-browser-tests.cjs --skip-pdf --artifact-dir output/implementation-2.24.10/interaction
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/longitudinal-browser-tests.cjs --artifact-dir output/implementation-2.24.10/resumed/ci/browser-full
      - name: Build and verify the standalone Windows programs
        run: |
          npm run dist:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-desktop-package.cjs
      - name: Exercise focused packaged workflow and full native regression
        run: |
          $env:MOTIONBENCH_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/win-unpacked/MotionBench.exe'
          node tests/longitudinal-browser-tests.cjs --desktop --artifact-dir output/implementation-2.24.10/native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/longitudinal-browser-tests.cjs --desktop --pdf --artifact-dir output/implementation-2.24.10/resumed/ci/native-full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MOTIONBENCH_DESKTOP_ARTIFACT_DIR = 'output/implementation-2.24.10/resumed/ci/native-smoke'
          node tests/desktop-smoke.cjs
      - name: Verify source-bound targeted and full CI evidence
        run: python scripts/release_v22410.py verify
      - name: Save synthetic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MotionBench-Comparison-Windows-${{ github.run_number }}
          path: |
            output/implementation-2.24.10/resumed/units/
            output/implementation-2.24.10/focused/
            output/implementation-2.24.10/interaction/
            output/implementation-2.24.10/native/
            output/implementation-2.24.10/resumed/ci/
            output/desktop-package/
          retention-days: 14
