name: MotionBench Windows Desktop

on:
  push:
    branches:
      - desktop-windows-*
      - codex/motionbench-2.19.*
      - codex/motionbench-2.20.*
      - main
    tags:
      - v*-desktop.*
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
      MOTIONBENCH_UPDATE_UNIT_ARTIFACT_DIR: output/tests/v220-desktop
      MOTIONBENCH_DESKTOP_SETTINGS_ARTIFACT_DIR: output/playwright/v220/settings
    steps:
      - name: Check out the reviewed desktop branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Python for the shared HTML build
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install locked build and production dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the shared offline application
        run: npm run build
      - name: Check existing application calculations and models
        run: node tests/run-unit-tests.cjs --artifact-dir output/tests/v220
      - name: Check desktop security and embedded AI service
        run: npm run test:desktop-unit
      - name: Check 2.20 management, ordinary saves and concurrent storage in both browsers
        run: npm run test:v220-management && npm run test:v220-app && npm run test:v220-storage
      - name: Export synthetic three-axis and seven-axis PDFs in Chrome and Edge
        run: node tests/pdf-multiaxis-v221-browser-tests.cjs && node tests/pdf-multiaxis-v221-browser-tests.cjs --edge
      - name: Check desktop settings and version notification in browsers
        run: npm run test:desktop-settings
      - name: Create the Windows x64 installer and portable executable
        run: npm run dist:windows
      - name: Verify packaged assets and bundled Chromium
        run: npm run verify:desktop-package
      - name: Exercise the actual packaged Windows application
        shell: pwsh
        run: |
          $env:MOTIONBENCH_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/win-unpacked/MotionBench.exe'
          $env:MOTIONBENCH_DESKTOP_ARTIFACT_DIR = Join-Path $env:GITHUB_WORKSPACE 'output/desktop-smoke/packaged'
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MOTIONBENCH_DESKTOP_V220_ARTIFACT_DIR = Join-Path $env:GITHUB_WORKSPACE 'output/desktop-v220-management/packaged'
          npm run test:v221-desktop-management
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/desktop-v221-pdf-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MOTIONBENCH_UPDATE_NATIVE_ARTIFACT_DIR = Join-Path $env:GITHUB_WORKSPACE 'output/tests/v220-desktop/packaged-updates'
          npm run test:desktop-updates-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise the actual single-file portable wrapper
        shell: pwsh
        run: |
          $portable = Get-ChildItem 'dist-desktop/*-Portable-x64.exe' | Select-Object -First 1
          if (-not $portable) { throw 'Missing Windows portable executable' }
          $env:MOTIONBENCH_PORTABLE_EXECUTABLE = $portable.FullName
          $env:MOTIONBENCH_PORTABLE_ARTIFACT_DIR = Join-Path $env:GITHUB_WORKSPACE 'output/desktop-smoke/portable'
          node tests/portable-wrapper-tests.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the actual assisted directory page on a private CI desktop
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'dist-desktop/*-Setup-x64.exe' | Select-Object -First 1
          $directory = Join-Path $env:RUNNER_TEMP ('MotionBench 目录选择\验证 MotionBench-' + [guid]::NewGuid().ToString('N'))
          ./tests/desktop-installer-wizard-ci.ps1 -InstallerPath $installer.FullName -ProposedDirectory $directory -ResultDirectory "$env:GITHUB_WORKSPACE/output/tests/v220-desktop/installer-wizard"
      - name: Upgrade the fixed previous installer and preserve the default synthetic library
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'dist-desktop/*-Setup-x64.exe' | Select-Object -First 1
          ./tests/desktop-installed-upgrade-v221-ci.ps1 -InstallerPath $installer.FullName
      - name: Install and exercise the per-user application
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'dist-desktop/*-Setup-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Missing Windows installer' }
          $installDirectory = Join-Path $env:RUNNER_TEMP 'MotionBench 安装验证\应用 MotionBench'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDirectory" -WindowStyle Hidden -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          $installedExecutable = Join-Path $installDirectory 'MotionBench.exe'
          if (-not (Test-Path $installedExecutable)) { throw 'Installed executable is missing' }
          $env:MOTIONBENCH_EXECUTABLE = $installedExecutable
          $env:MOTIONBENCH_DESKTOP_ARTIFACT_DIR = Join-Path $env:GITHUB_WORKSPACE 'output/desktop-smoke/installed'
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # An --updated invocation must reuse HKCU InstallLocation without /D.
          # This is a reinstall/path check; it does not replace cross-version testing.
          $reinstall = Start-Process -FilePath $installer.FullName -ArgumentList '--updated /S' -WindowStyle Hidden -PassThru -Wait
          if ($reinstall.ExitCode -ne 0) { throw "In-place reinstall failed with exit code $($reinstall.ExitCode)" }
          if (-not (Test-Path -LiteralPath $installedExecutable)) { throw 'In-place reinstall changed the chosen installation path' }
          # Smoke profiles are intentionally disposable. This separate synthetic
          # canary verifies the real default user data directory survives uninstall.
          $defaultDataDirectory = Join-Path $env:APPDATA 'MotionBench Desktop'
          New-Item -ItemType Directory -Force -Path $defaultDataDirectory | Out-Null
          $canary = Join-Path $defaultDataDirectory ("desktop-uninstall-canary-" + [guid]::NewGuid().ToString('N') + '.json')
          [ordered]@{ synthetic = $true; purpose = 'uninstall data preservation'; run = $env:GITHUB_RUN_ID } |
            ConvertTo-Json | Set-Content -LiteralPath $canary -Encoding utf8
          $canaryHashBefore = (Get-FileHash -LiteralPath $canary -Algorithm SHA256).Hash
          $uninstaller = Get-ChildItem $installDirectory -Filter '*Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Installed uninstaller is missing' }
          $registryPath = 'HKCU:\Software\7ab680cb-2a51-5387-9959-bfceb2c524d6'
          $captureUninstallState = {
            param($directory, $application, $originalUninstaller, $registry, $allProcesses)
            $prefix = [IO.Path]::GetFullPath($directory).TrimEnd('\') + '\'
            $state = [ordered]@{ appExeExists=(Test-Path -LiteralPath $application); originalUninstallerExists=(Test-Path -LiteralPath $originalUninstaller); hkcuInstallLocation=$null; processes=@() }
            try { $state.hkcuInstallLocation = (Get-ItemProperty -LiteralPath $registry -ErrorAction SilentlyContinue).InstallLocation } catch { $state.registryError=$_.Exception.Message }
            try {
              $state.processes = @(Get-CimInstance Win32_Process -ErrorAction Stop | Where-Object { $allProcesses -or ($_.ExecutablePath -and $_.ExecutablePath.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) } | Sort-Object ProcessId | ForEach-Object {
                [ordered]@{ pid=[uint32]$_.ProcessId; parentPid=[uint32]$_.ParentProcessId; name=$_.Name; path=$_.ExecutablePath; createdUtc=if ($_.CreationDate) { $_.CreationDate.ToUniversalTime().ToString('o') } else { $null } }
              })
            } catch { $state.processSnapshotError=$_.Exception.Message }
            return $state
          }
          $uninstallDiagnostic = [ordered]@{
            synthetic = $true
            sourceHtmlSha256 = (Get-FileHash -LiteralPath 'MotionBench.html' -Algorithm SHA256).Hash.ToLowerInvariant()
            installerSha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            installDirectory = $installDirectory
            originalUninstaller = $uninstaller.FullName
            originalUninstallerSha256 = (Get-FileHash -LiteralPath $uninstaller.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            arguments = '/S'
            before = (& $captureUninstallState $installDirectory $installedExecutable $uninstaller.FullName $registryPath $false)
            canarySha256Before = $canaryHashBefore.ToLowerInvariant()
            outcomeAssertionsPassed = $false
            pollIntervalMilliseconds = 250
            pollBudgetSeconds = 180
            observationLimit = 'Finite snapshots can miss a short-lived process; an absent observed descendant does not prove that no child was launched.'
          }
          $uninstallSamples = [Collections.Concurrent.ConcurrentQueue[object]]::new()
          $monitorControl = [hashtable]::Synchronized(@{ stop=$false; ready=$false; polls=0 })
          $uninstallMonitor = $null
          $uninstall = $null
          try {
            # Observe while preserving Start-Process -Wait and the normal /S lifecycle.
            # Process metadata stays in memory until it is filtered to this owned
            # install directory and the actual bootstrap's observed descendants.
            $uninstallMonitor = Start-ThreadJob -ArgumentList $captureUninstallState,$installDirectory,$installedExecutable,$uninstaller.FullName,$registryPath,$uninstallSamples,$monitorControl -ScriptBlock {
              param($capture, $directory, $application, $originalUninstaller, $registry, $samples, $control)
              $deadline = [DateTime]::UtcNow.AddSeconds(180)
              while (-not $control.stop -and [DateTime]::UtcNow -lt $deadline) {
                $samples.Enqueue([ordered]@{ at=[DateTime]::UtcNow.ToString('o'); state=(& $capture $directory $application $originalUninstaller $registry $true) })
                $control.polls++
                $control.ready=$true
                Start-Sleep -Milliseconds 250
              }
            }
            $monitorReadyDeadline = [DateTime]::UtcNow.AddSeconds(5)
            while (-not $monitorControl.ready -and [DateTime]::UtcNow -lt $monitorReadyDeadline) { Start-Sleep -Milliseconds 50 }
            $uninstallDiagnostic.monitorReadyBeforeLaunch = $monitorControl.ready
            $uninstallDiagnostic.startedUtc = [DateTime]::UtcNow.ToString('o')
            $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -WindowStyle Hidden -PassThru -Wait
            $uninstallDiagnostic.launchProcess = [ordered]@{ pid=$uninstall.Id; exitCode=$uninstall.ExitCode; returnedUtc=[DateTime]::UtcNow.ToString('o') }
            if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)" }
            # An NSIS bootstrap can hand off to a temporary uninstaller. Check
            # the actual removal outcome before declaring user data preserved.
            $removalDeadline = [DateTime]::UtcNow.AddSeconds(60)
            while ((Test-Path -LiteralPath $installedExecutable) -or (Test-Path -LiteralPath $uninstaller.FullName)) {
              if ([DateTime]::UtcNow -ge $removalDeadline) { throw 'Uninstall did not remove the application and original uninstaller within 60 seconds' }
              Start-Sleep -Milliseconds 200
            }
            if (-not (Test-Path -LiteralPath $canary)) { throw 'Uninstall removed the synthetic default user data canary' }
            $canaryHashAfter = (Get-FileHash -LiteralPath $canary -Algorithm SHA256).Hash
            if ($canaryHashAfter -ne $canaryHashBefore) { throw 'Uninstall changed the synthetic default user data canary' }
            [ordered]@{
              synthetic = $true
              defaultDataDirectory = $defaultDataDirectory
              canarySha256Before = $canaryHashBefore.ToLowerInvariant()
              canarySha256After = $canaryHashAfter.ToLowerInvariant()
              applicationRemoved = $true
              uninstallerRemoved = $true
              preserved = $true
            } | ConvertTo-Json | Set-Content 'output/desktop-package/uninstall-data-check.json' -Encoding utf8
            $uninstallDiagnostic.outcomeAssertionsPassed = $true
          } catch { $uninstallDiagnostic.failure=$_.Exception.Message; throw }
          finally {
            $monitorControl.stop=$true
            if ($uninstallMonitor) {
              $monitorCompleted = $uninstallMonitor | Wait-Job -Timeout 10
              if (-not $monitorCompleted) { Stop-Job -Job $uninstallMonitor; $uninstallDiagnostic.monitorCleanupTimedOut=$true }
              $uninstallDiagnostic.monitorErrors = @($uninstallMonitor.ChildJobs | ForEach-Object { $_.Error | ForEach-Object { $_.ToString() } })
              Remove-Job -Job $uninstallMonitor -Force
            }
            $samples = @($uninstallSamples.ToArray())
            $descendantIds = [Collections.Generic.HashSet[uint32]]::new()
            if ($uninstall) { [void]$descendantIds.Add([uint32]$uninstall.Id) }
            do {
              $added=$false
              foreach ($sample in $samples) { foreach ($processRow in $sample.state.processes) {
                if ($descendantIds.Contains($processRow.parentPid) -and $processRow.createdUtc -ge $uninstallDiagnostic.startedUtc) { if ($descendantIds.Add($processRow.pid)) { $added=$true } }
              } }
            } while ($added)
            $prefix = [IO.Path]::GetFullPath($installDirectory).TrimEnd('\') + '\'
            $transitions = @()
            $previousState = $null
            foreach ($sample in $samples) {
              $sample.state.processes = @($sample.state.processes | Where-Object { $descendantIds.Contains($_.pid) -or ($_.path -and $_.path.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) })
              $serializedState = $sample.state | ConvertTo-Json -Depth 8 -Compress
              if ($serializedState -ne $previousState) { $transitions += $sample; $previousState=$serializedState }
            }
            $uninstallDiagnostic.polls = $monitorControl.polls
            $uninstallDiagnostic.transitions = $transitions
            $uninstallDiagnostic.after = (& $captureUninstallState $installDirectory $installedExecutable $uninstaller.FullName $registryPath $false)
            $uninstallDiagnostic.canaryExistsAfter = Test-Path -LiteralPath $canary
            if ($uninstallDiagnostic.canaryExistsAfter) {
              try { $uninstallDiagnostic.canarySha256After=(Get-FileHash -LiteralPath $canary -Algorithm SHA256).Hash.ToLowerInvariant() } catch { $uninstallDiagnostic.canaryHashError=$_.Exception.Message }
            }
            $uninstallDiagnostic | ConvertTo-Json -Depth 12 | Set-Content 'output/desktop-package/uninstall-diagnostic.json' -Encoding utf8
          }
          Remove-Item -LiteralPath $canary
      - name: Create SHA-256 checksums and build provenance
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem 'dist-desktop/*.exe' | Sort-Object Name)
          if ($executables.Count -ne 2) { throw 'Expected exactly installer and portable executables' }
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $desktopVersion = node -e "console.log(require('js-yaml').load(require('fs').readFileSync('electron-builder.yml','utf8')).extraMetadata.version)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read desktop build version' }
          $metadata = Join-Path $env:GITHUB_WORKSPACE 'dist-desktop/desktop.yml'
          if (-not (Test-Path -LiteralPath $metadata)) { throw 'Missing dedicated desktop update metadata' }
          $blockmaps = @(Get-ChildItem 'dist-desktop/*-Setup-x64.exe.blockmap')
          if ($blockmaps.Count -ne 1) { throw 'Expected one installer blockmap' }
          $hashTargets = @($executables) + @($blockmaps) + @(Get-Item -LiteralPath $metadata)
          $assetSha256 = [ordered]@{}
          $checksums = foreach ($file in ($hashTargets | Sort-Object Name)) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $assetSha256[$file.Name] = $hash
            "$hash  $($file.Name)"
          }
          $checksums | Set-Content 'dist-desktop/SHA256SUMS.txt' -Encoding utf8
          $wizard = Get-Content 'output/tests/v220-desktop/installer-wizard/wizard-results.json' -Raw | ConvertFrom-Json
          $upgrade = Get-Content 'output/tests/v220-desktop/installed-upgrade/upgrade-results.json' -Raw | ConvertFrom-Json
          $upgradeVerified = Get-Content 'output/tests/v220-desktop/installed-upgrade/verify-results.json' -Raw | ConvertFrom-Json
          if (-not $wizard.passed -or -not $upgrade.passed -or -not $upgradeVerified.passed) { throw 'Actual guided installation or old-to-new upgrade checks did not pass' }
          $hostHashes = [ordered]@{}
          foreach ($file in (Get-ChildItem 'desktop/*.cjs' | Sort-Object Name)) { $hostHashes['desktop/' + $file.Name] = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          $ciResult = [ordered]@{
            schema = 1
            synthetic = $true
            passed = $true
            commit = $env:GITHUB_SHA
            version = $desktopVersion
            webVersion = $package.version
            htmlSha256 = (Get-FileHash 'MotionBench.html' -Algorithm SHA256).Hash.ToLowerInvariant()
            sourceHtmlSha256 = (Get-FileHash 'MotionBench.html' -Algorithm SHA256).Hash.ToLowerInvariant()
            hostSourceHashes = $hostHashes
            assetSha256 = $assetSha256
            installerWizard = $wizard
            previousVersionUpgrade = $upgrade
            upgradedLibrary = $upgradeVerified
            run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          }
          [ordered]@{
            version = $desktopVersion
            webVersion = $package.version
            commit = $env:GITHUB_SHA
            branch = $env:GITHUB_REF_NAME
            run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            electron = $package.devDependencies.electron
            electronBuilder = $package.devDependencies.'electron-builder'
            electronUpdater = $package.dependencies.'electron-updater'
            architecture = 'x64'
            signed = $false
            packagedSmoke = 'passed'
            installedSmoke = 'passed'
            portableWrapperSmoke = 'passed'
            syntheticDefaultDataUninstallCheck = 'passed'
            inPlaceReinstallPathCheck = 'passed'
            guidedDirectoryWizardCheck = 'passed'
            previousVersionUpgradeCheck = 'passed'
            previousVersion = $upgrade.oldVersion
            previousInstallerSha256 = $upgrade.oldInstallerSha256
            previousArchiveUrl = $upgrade.previousArchiveUrl
            previousArchiveSha256 = $upgrade.previousArchiveSha256
            previousArchiveSize = $upgrade.previousArchiveSize
            assetSha256 = $assetSha256
          } | ConvertTo-Json -Depth 6 | Set-Content 'dist-desktop/build-provenance.json' -Encoding utf8
          $artifactRows = @()
          foreach ($file in ($hashTargets | Sort-Object Name)) {
            $artifactRows += [ordered]@{path=('dist-desktop/' + $file.Name);sha256=$assetSha256[$file.Name];kind='update-asset'}
          }
          $evidenceFiles = [ordered]@{
            'dist-desktop/SHA256SUMS.txt' = 'checksums'
            'dist-desktop/build-provenance.json' = 'provenance'
            'output/tests/v220-desktop/installer-wizard/wizard-results.json' = 'wizard'
            'output/tests/v220-desktop/installer-wizard/installation-directory-page.bmp' = 'wizard-screenshot'
            'output/tests/v220-desktop/installed-upgrade/upgrade-results.json' = 'upgrade'
            'output/tests/v220-desktop/installed-upgrade/seed-results.json' = 'upgrade-seed'
            'output/tests/v220-desktop/installed-upgrade/verify-results.json' = 'upgrade-library'
            'output/desktop-smoke/installed/results.json' = 'installed-smoke'
            'output/desktop-smoke/portable/results.json' = 'portable'
            'output/desktop-package/uninstall-data-check.json' = 'uninstall'
            'output/desktop-package/uninstall-diagnostic.json' = 'uninstall-diagnostic'
            'output/desktop-v220-management/packaged/native-management-results.json' = 'management-native'
            'output/tests/v221-desktop/packaged-pdf/native-pdf-results.json' = 'pdf-native'
          }
          foreach ($entry in $evidenceFiles.GetEnumerator()) { $artifactRows += [ordered]@{path=$entry.Key;sha256=(Get-FileHash -LiteralPath $entry.Key -Algorithm SHA256).Hash.ToLowerInvariant();kind=$entry.Value} }
          $producerScripts = @()
          foreach ($repoPath in @('.github/workflows/desktop-windows.yml','scripts/check-desktop-package.cjs','tests/desktop-installer-wizard-ci.ps1','tests/helpers/desktop-installer-native.cs','tests/desktop-installed-upgrade-v221-ci.ps1','tests/fixtures/desktop-upgrade-baseline-v220.json','tests/desktop-upgrade-library-v221-ci.cjs','tests/desktop-smoke.cjs','tests/desktop-v221-management-tests.cjs','tests/helpers/desktop-artifact-identity.cjs','tests/portable-wrapper-tests.cjs','tests/pdf-multiaxis-v221-browser-tests.cjs','tests/desktop-v221-pdf-tests.cjs')) {
            $producerScripts += [ordered]@{repoPath=$repoPath;sha256=(Get-FileHash -LiteralPath $repoPath -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          $ciResult.artifacts = $artifactRows
          $ciResult.producerScripts = $producerScripts
          $ciResult | ConvertTo-Json -Depth 12 | Set-Content 'output/tests/v220-desktop/ci-results.json' -Encoding utf8
      - name: Upload verified Windows downloads
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: MotionBench-Windows-x64-${{ github.run_number }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*-Setup-x64.exe.blockmap
            dist-desktop/desktop.yml
            dist-desktop/SHA256SUMS.txt
            dist-desktop/build-provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload test evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: MotionBench-Desktop-Evidence-${{ github.run_number }}
          path: |
            output/desktop-smoke/
            output/desktop-package/
            output/desktop-v220-management/
            output/playwright/v220/
            output/playwright/management-v220/
            output/implementation-2.20.1/pdf/
            output/tests/
          if-no-files-found: warn
          retention-days: 90
